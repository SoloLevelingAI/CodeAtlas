name: Verify architecture and code
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/architecture/package-lock.json
      - name: LikeC4 dependencies
        run: npm ci --prefix docs/architecture
      - name: Markdown and application resource consistency
        run: python scripts/sync-architecture.py --check
      - name: LikeC4 target model consistency
        run: python scripts/sync-likec4.py --check
      - name: Build, independent regressions and self-analysis
        shell: pwsh
        run: ./scripts/verify-desktop.ps1
      - name: Module regressions, drift and warning baseline
        shell: pwsh
        run: ./scripts/verify-modules.ps1
