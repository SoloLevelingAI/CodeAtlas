name: Verify architecture and code
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Markdown and application resource consistency
        run: python scripts/sync-architecture.py --check
      - name: Build, independent regressions and self-analysis
        shell: pwsh
        run: ./scripts/verify-desktop.ps1
